services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: itjp_interview
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-local-dev-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-local-dev-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
