services:
  - type: web
    name: kotoba
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: COOKIE_SECURE
        value: "true"
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AI_API_KEY
        sync: false
